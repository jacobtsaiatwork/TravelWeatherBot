name: 晨間通勤與天氣預報自動推播

on:
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行測試

jobs:
  run-daily-brief:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 建立環境變數檔 (.env)
        env:
          DOTENV_CONTENT: ${{ secrets.DOTENV }}
        run: |
          echo "$DOTENV_CONTENT" > .env

      - name: 執行晨間通勤天氣推播
        run: |
          python commute_brief.py --force
