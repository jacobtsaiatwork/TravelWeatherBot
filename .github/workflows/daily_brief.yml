name: 晨間通勤與天氣預報自動推播
on:
  schedule:
    # 台灣時間 (UTC+8) 平日週一至週五 07:40 AM
    # 對應 UTC 時間週日至週四 23:40
    - cron: '40 23 * * 0-4'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行測試
jobs:
  run-daily-brief:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4
      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 執行晨間通勤天氣推播
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LOCATION: '臺北市'
          USER_NAME: '通勤夥伴'
        run: |
          python commute_brief.py --force
